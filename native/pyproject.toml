[build-system]
requires=["setuptools>=84.2.1"]
build-backend="setuptools.build_meta"
[project]
name="minimax-h3-native"
version="0.1.0.dev0"
readme="README.md"
description="Experimental exact native H3 response plus explicit captured-profile runner boundary"
requires-python=">=3.11,<3.15"
license="MIT"
dependencies=[
 "torch>=2.9,<2.10", "particlegan==0.11.1", "hndl==0.10.0",
 "hypergan @ git+https://github.com/HyperGAN/HyperGAN.git@5f368a3770cf5bdae0448995c9f76e29af8049f7",
 "particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@ec1161f5d74481be3540cb0dfa63d0e8f8b54e90#subdirectory=packages/particle-sliders-core",
 "diffusers @ git+https://github.com/huggingface/diffusers.git@d0b9b1b5a540e5f9df2f8ec236347bf9c5aa7d1f",
 "transformers==5.22.1", "peft==0.21.2", "accelerate>=1,<2", "safetensors>=0.4,<1", "Pillow>=13.0.0,<14"
]
[project.optional-dependencies]
test=["pytest>=8"]
[project.scripts]
h3-native="minimax_h3_native.cli:main"
h3-phase="minimax_h3_phase.cli:main"
[project.entry-points."particle_sliders.response_backends"]
minimax_h3_native_av="minimax_h3_native.lifecycle:BACKEND"
minimax_h3_phase_owned_av="minimax_h3_phase.lifecycle:BACKEND"
[project.entry-points."particle_sliders.inference_backends"]
minimax_h3_native_av="minimax_h3_native.lifecycle:NATIVE_BACKEND"
minimax_h3_phase_owned_av="minimax_h3_phase.lifecycle:NATIVE_BACKEND"
[tool.setuptools.packages.find]
where=["src"]
[tool.setuptools.package-data]
minimax_h3_native=["data/*.json","data/*.hndl","*.json"]

minimax_h3_phase=["data/*.json","data/*.hndl","*.json"]

minimax_h3_runner=["profile.json", "captured/*.py", "captured/*.json"]
